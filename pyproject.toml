[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparcof-reproducible"
version = "1.0.0"
description = "Configuration-driven, reproducible SPARCOF feature-selection experiments for tabular classification data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
selectors = ["lightgbm>=4.0", "xgboost>=2.0"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
sparcof = "sparcof.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
